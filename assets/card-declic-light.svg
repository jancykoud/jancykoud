<desc id="d">confidential. Cataloguing connected scientific instruments. 4-step declaration flow, moderated before publication. Catalogue of 53 LoRaWAN instrument models, OIDC sign-in. Built with React, TypeScript, Express, Prisma, PostgreSQL.</desc>
